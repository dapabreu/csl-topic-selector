<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Topic Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">Topic Selector</h1>
            </div>
            <div id="user-info" class="hidden items-center gap-3 text-sm font-medium text-slate-600">
                <span id="display-name" class="px-3 py-1 bg-slate-100 rounded-full border border-slate-200"></span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 sm:p-8 relative max-w-5xl mx-auto w-full">
        
        <!-- Loading Screen -->
        <div id="loading-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-20 fade-in">
            <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
            <p class="text-slate-500 font-medium animate-pulse">Connecting to session...</p>
        </div>

        <!-- Name Entry Screen -->
        <div id="name-screen" class="hidden absolute inset-0 flex items-center justify-center bg-slate-50 z-10 p-4 fade-in">
            <div class="glass-panel p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Welcome!</h2>
                <p class="text-slate-500 mb-6 text-sm">Enter your name to join the session and claim your topic.</p>
                <form id="name-form" class="flex flex-col gap-4">
                    <input type="text" id="name-input" placeholder="Your full name" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all shadow-sm">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md active:scale-[0.98]">
                        Join Session
                    </button>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="hidden w-full grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
            
            <!-- Left Column: Add Topic & Stats -->
            <div class="flex flex-col gap-6 md:col-span-1">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Add New Topic
                    </h3>
                    <form id="add-topic-form" class="flex flex-col gap-3">
                        <textarea id="topic-input" required rows="2" placeholder="e.g., The impact of AI on modern healthcare" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none shadow-sm transition-all"></textarea>
                        <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg transition-all text-sm shadow-sm active:scale-[0.98]">
                            Add to Pool
                        </button>
                    </form>
                </div>

                <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                    <h3 class="font-bold text-indigo-900 mb-2">Session Stats</h3>
                    <div class="flex justify-between items-center py-2 border-b border-indigo-100">
                        <span class="text-sm text-indigo-700">Total Topics</span>
                        <span id="stat-total" class="font-bold text-indigo-900 bg-white px-2 py-0.5 rounded shadow-sm text-sm">0</span>
                    </div>
                    <div class="flex justify-between items-center py-2 border-b border-indigo-100">
                        <span class="text-sm text-indigo-700">Available</span>
                        <span id="stat-available" class="font-bold text-emerald-600 bg-white px-2 py-0.5 rounded shadow-sm text-sm">0</span>
                    </div>
                    <div class="flex justify-between items-center py-2">
                        <span class="text-sm text-indigo-700">Claimed</span>
                        <span id="stat-claimed" class="font-bold text-slate-500 bg-white px-2 py-0.5 rounded shadow-sm text-sm">0</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Topic List -->
            <div class="md:col-span-2 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-slate-800">Topic Pool</h2>
                    <div class="flex gap-2">
                        <button id="filter-all" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-white transition-colors">All</button>
                        <button id="filter-available" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">Available</button>
                    </div>
                </div>
                
                <div id="empty-state" class="hidden flex-col items-center justify-center p-12 bg-white rounded-2xl border border-slate-200 border-dashed text-center">
                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mb-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    </div>
                    <p class="text-slate-500 font-medium">No topics available yet.</p>
                    <p class="text-slate-400 text-sm mt-1">Be the first to add one to the pool!</p>
                </div>

                <div id="topics-list" class="flex flex-col gap-3">
                    <!-- Topics will be dynamically injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase Imports and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, addDoc, onSnapshot, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let db, auth;
        let currentUser = null;
        let userName = localStorage.getItem('ts_username') || '';
        let allTopics = [];
        let currentFilter = 'all'; // 'all' or 'available'
        
        // App Environment variables
        const appId = 'topic-selector-app';
        const firebaseConfig = {
          apiKey: "AIzaSyAw6Du4fpPI8gbkJth7PwfcylyJXIU0c80",
          authDomain: "cls-topic-selector.firebaseapp.com",
          projectId: "cls-topic-selector",
          storageBucket: "cls-topic-selector.firebasestorage.app",
          messagingSenderId: "364142564972",
          appId: "1:364142564972:web:a133d3757d655f9cf5aa49",
          measurementId: "G-6CNQNMG4R5"
        };

        // DOM Elements
        const loadingScreen = document.getElementById('loading-screen');
        const nameScreen = document.getElementById('name-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const nameForm = document.getElementById('name-form');
        const nameInput = document.getElementById('name-input');
        const userInfo = document.getElementById('user-info');
        const displayName = document.getElementById('display-name');
        
        const addTopicForm = document.getElementById('add-topic-form');
        const topicInput = document.getElementById('topic-input');
        const topicsList = document.getElementById('topics-list');
        const emptyState = document.getElementById('empty-state');
        
        const statTotal = document.getElementById('stat-total');
        const statAvailable = document.getElementById('stat-available');
        const statClaimed = document.getElementById('stat-claimed');

        const filterAllBtn = document.getElementById('filter-all');
        const filterAvailableBtn = document.getElementById('filter-available');
        const toastContainer = document.getElementById('toast-container');

        // --- Helper Functions ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-red-500' : 'bg-slate-800');
            toast.className = `${bg} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 transform transition-all duration-300 translate-y-[-100%] opacity-0 pointer-events-auto`;
            
            const icon = type === 'success' 
                ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
            toast.innerHTML = `${icon}<span class="text-sm font-medium">${message}</span>`;
            toastContainer.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-100%]', 'opacity-0');
            });
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-[-100%]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateUIState() {
            if (!currentUser) {
                loadingScreen.classList.remove('hidden');
                nameScreen.classList.add('hidden');
                dashboardScreen.classList.add('hidden');
            } else if (!userName) {
                loadingScreen.classList.add('hidden');
                nameScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
                nameInput.focus();
            } else {
                loadingScreen.classList.add('hidden');
                nameScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                displayName.textContent = userName;
                renderTopics(); // Ensure topics are drawn when reaching dashboard
            }
        }

        function renderTopics() {
            if (!userName) return; // Don't render if not logged in fully

            // Filter and sort topics entirely in memory as per constraints (no complex firestore queries)
            let displayTopics = [...allTopics];
            
            // Sort by creation date (newest first)
            displayTopics.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            // Apply filter
            if (currentFilter === 'available') {
                displayTopics = displayTopics.filter(t => !t.claimedByUid);
            }

            // Update stats
            const total = allTopics.length;
            const claimed = allTopics.filter(t => t.claimedByUid).length;
            const available = total - claimed;
            
            statTotal.textContent = total;
            statAvailable.textContent = available;
            statClaimed.textContent = claimed;

            if (displayTopics.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                topicsList.innerHTML = '';
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            topicsList.innerHTML = '';
            
            displayTopics.forEach(topic => {
                const isClaimed = !!topic.claimedByUid;
                const isClaimedByMe = isClaimed && topic.claimedByUid === currentUser.uid;
                
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition-all duration-200 flex items-center justify-between gap-4 
                    ${isClaimed 
                        ? (isClaimedByMe ? 'bg-indigo-50 border-indigo-200 opacity-90' : 'bg-slate-50 border-slate-200 opacity-75')
                        : 'bg-white border-slate-200 hover:border-indigo-300 hover:shadow-md'}`;
                
                // Title Area
                const textContainer = document.createElement('div');
                textContainer.className = 'flex-grow min-w-0';
                
                const titleText = document.createElement('p');
                titleText.className = `font-medium truncate ${isClaimed && !isClaimedByMe ? 'line-through text-slate-500' : 'text-slate-800'}`;
                titleText.title = topic.title;
                titleText.textContent = topic.title;
                textContainer.appendChild(titleText);

                // Action/Status Area
                const actionContainer = document.createElement('div');
                actionContainer.className = 'flex-shrink-0 flex items-center gap-3';

                if (isClaimed) {
                    const badge = document.createElement('span');
                    badge.className = `text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5
                        ${isClaimedByMe ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-200 text-slate-600'}`;
                    
                    const iconSvg = isClaimedByMe 
                        ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                        : '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>';
                    
                    badge.innerHTML = `${iconSvg} ${isClaimedByMe ? 'Claimed by you' : 'Claimed by ' + topic.claimedByName}`;
                    actionContainer.appendChild(badge);
                } else {
                    const claimBtn = document.createElement('button');
                    claimBtn.className = 'bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold px-4 py-1.5 rounded-lg transition-colors active:scale-95 shadow-sm';
                    claimBtn.textContent = 'Claim';
                    claimBtn.onclick = () => claimTopic(topic.id);
                    actionContainer.appendChild(claimBtn);
                }

                card.appendChild(textContainer);
                card.appendChild(actionContainer);
                topicsList.appendChild(card);
            });
        }

        // --- Event Listeners ---
        nameForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = nameInput.value.trim();
            if (val) {
                userName = val;
                localStorage.setItem('ts_username', userName);
                showToast(`Welcome, ${userName}!`);
                updateUIState();
            }
        });

        addTopicForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !userName) return;
            
            const title = topicInput.value.trim();
            if (!title) return;

            const submitBtn = addTopicForm.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-pulse">Adding...</span>';

            try {
                // Strict path required by rules
                const topicsRef = collection(db, 'artifacts', appId, 'public', 'data', 'topics');
                await addDoc(topicsRef, {
                    title: title,
                    createdBy: currentUser.uid,
                    creatorName: userName,
                    createdAt: Date.now(), // Using client date for simplicity in sorting, serverTimestamp causes null issues locally sometimes
                    claimedByUid: null,
                    claimedByName: null,
                    claimedAt: null
                });
                
                topicInput.value = '';
                showToast('Topic added successfully!');
            } catch (err) {
                console.error("Error adding topic: ", err);
                showToast('Failed to add topic', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add to Pool';
            }
        });

        filterAllBtn.addEventListener('click', () => {
            currentFilter = 'all';
            filterAllBtn.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-white transition-colors';
            filterAvailableBtn.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors';
            renderTopics();
        });

        filterAvailableBtn.addEventListener('click', () => {
            currentFilter = 'available';
            filterAvailableBtn.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-white transition-colors';
            filterAllBtn.className = 'text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors';
            renderTopics();
        });

        // --- Core Application Logic ---
        async function claimTopic(topicId) {
            if (!currentUser || !userName) return;
            
            // Optimistic pre-check (reduces failed attempts before hitting network)
            const topic = allTopics.find(t => t.id === topicId);
            if (!topic || topic.claimedByUid) {
                showToast('Oops, this topic was already claimed!', 'error');
                return;
            }

            try {
                const topicRef = doc(db, 'artifacts', appId, 'public', 'data', 'topics', topicId);
                await updateDoc(topicRef, {
                    claimedByUid: currentUser.uid,
                    claimedByName: userName,
                    claimedAt: Date.now()
                });
                showToast('Topic claimed successfully!');
            } catch (err) {
                console.error("Error claiming topic: ", err);
                showToast('Could not claim topic. Someone might have been faster!', 'error');
            }
        }

        function setupRealtimeListener() {
            // Strict path required by rules
            const topicsRef = collection(db, 'artifacts', appId, 'public', 'data', 'topics');
            
            // Simple query, fetch all, handle logic locally
            onSnapshot(topicsRef, (snapshot) => {
                const topics = [];
                snapshot.forEach((doc) => {
                    topics.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                allTopics = topics;
                renderTopics();
            }, (error) => {
                console.error("Real-time sync error: ", error);
                showToast("Connection to live session lost.", "error");
            });
        }

        // --- Initialization ---
        async function init() {
            if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) {
                loadingScreen.innerHTML = `
                    <div class="text-center p-6 glass-panel rounded-xl">
                        <h2 class="text-xl font-bold text-red-600 mb-2">Configuration Missing</h2>
                        <p class="text-slate-600 text-sm">Firebase configuration is not available in this environment.</p>
                    </div>`;
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Auth flow required by rules
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;
                
                // Only setup listener AFTER successful auth
                setupRealtimeListener();
                updateUIState();

            } catch (err) {
                console.error("Initialization error: ", err);
                loadingScreen.innerHTML = `
                    <div class="text-center p-6 glass-panel rounded-xl max-w-sm">
                        <h2 class="text-xl font-bold text-red-600 mb-2">Connection Failed</h2>
                        <p class="text-slate-600 text-sm">${err.message}</p>
                    </div>`;
            }
        }

        // Boot up
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
